# Builds the Ghost9 classifier shell APK on GitHub Actions.
# Artifact: ghost9-clf-debug (the debug APK). Signing and release are later work.
name: android-apk

on:
  push:
    branches: [spike/android-apk]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ghost9-clf-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
